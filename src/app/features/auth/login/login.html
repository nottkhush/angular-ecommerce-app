<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Welcome Back</h2>
            <p>Sign in to your account to continue</p>
        </div>

        <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="auth-form">
            <div class="error-banner" *ngIf="error">
                <i class="icon-error"></i>
                <span>{{ error }}</span>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" [(ngModel)]="loginData.email" required
                        placeholder="john@example.com" #emailInput="ngModel"
                        [class.invalid]="emailInput.invalid && (emailInput.dirty || emailInput.touched)">
                </div>
            </div>

            <div class="form-group">
                <div class="label-flex">
                    <label for="password">Password</label>
                    <a href="javascript:void(0)" class="forgot-link">Forgot Password?</a>
                </div>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" [(ngModel)]="loginData.password" required
                        placeholder="••••••••" #passwordInput="ngModel"
                        [class.invalid]="passwordInput.invalid && (passwordInput.dirty || passwordInput.touched)">
                </div>
            </div>

            <button type="submit" class="btn-primary" [disabled]="loginForm.invalid || isLoading">
                <span *ngIf="!isLoading">Sign In</span>
                <span *ngIf="isLoading" class="spinner"></span>
            </button>

            <div class="auth-footer">
                <p>Don't have an account? <a routerLink="/auth/register">Create one</a></p>
            </div>
        </form>
    </div>
</div>
