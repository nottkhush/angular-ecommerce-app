<div class="products-container">
    <div class="products-header">
        <h1>All Products</h1>
        <p>Discover our wide range of premium items</p>
    </div>

    <ng-container *ngIf="vm$ | async as vm; else loadingTpl">
        <div class="search-box">
            <input class="search-input" type="text" placeholder="Search products..." [formControl]="search" />
        </div>

        <div class="category-filters" *ngIf="vm.categories.length > 1">
            <button *ngFor="let category of vm.categories" class="category-chip"
                [class.active]="category === vm.activeCategory" (click)="filterByCategory(category)">
                {{ category }}
            </button>
        </div>

        <div class="products-grid">
            <app-product-card *ngFor="let product of vm.items; trackBy: trackById" [product]="product">
            </app-product-card>
        </div>

        <div class="pagination-controls" *ngIf="vm.totalPages > 1">
            <button class="pagination-btn" [disabled]="vm.currentPage === 1" (click)="goToPage(vm.currentPage - 1)">
                Prev
            </button>
            <div class="page-numbers">
                <button class="page-number" *ngFor="let page of vm.pages" [class.active]="vm.currentPage === page"
                    (click)="goToPage(page)">
                    {{ page }}
                </button>
            </div>
            <button class="pagination-btn" [disabled]="vm.currentPage === vm.totalPages"
                (click)="goToPage(vm.currentPage + 1)">
                Next
            </button>
        </div>

        <div class="empty-state" *ngIf="vm.error">
            <h3>Something went wrong</h3>
            <p>Failed to load products. Please try again later.</p>
        </div>

        <div class="empty-state" *ngIf="!vm.error && vm.total === 0">
            <h3>No Products Found</h3>
            <p>Nothing matches your search or category.</p>
            <button class="btn-primary" (click)="clearFilters()">Clear Filters</button>
        </div>
    </ng-container>

    <ng-template #loadingTpl>
        <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading products...</p>
        </div>
    </ng-template>
</div>
