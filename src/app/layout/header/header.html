<header class="app-header">
    <div class="header-container max-width-wrapper">
        <div class="logo">
            <a routerLink="/">
                <span class="logo-text">Aura<span class="highlight">Shop</span></span>
            </a>
        </div>

        <nav class="main-nav">
            <ul>
                <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a></li>
                <li><a routerLink="/products" routerLinkActive="active">Shop</a></li>
            </ul>
        </nav>

        <div class="header-actions">
            <a routerLink="/cart" class="cart-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span class="cart-badge" *ngIf="cartItemCount > 0">{{ cartItemCount }}</span>
            </a>
            <a routerLink="/auth/login" class="login-btn">Login</a>
        </div>
    </div>
</header>
