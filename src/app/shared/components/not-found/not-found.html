<div class="notfound-container">
    <div class="content-wrapper">
        <div class="error-code">404</div>
        <div class="error-divider"></div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-description">
            Oops! The page you are looking for might have been removed, had its name changed, or is temporarily
            unavailable.
        </p>
        <div class="action-buttons">
            <button class="btn-primary" routerLink="/">
                <i class="icon-home"></i> Back to Homepage
            </button>
            <button class="btn-secondary" routerLink="/products">
                Browse Products
            </button>
        </div>
    </div>

    <div class="background-decorations">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
    </div>
</div>
